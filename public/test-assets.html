<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Aset - PT Bina Auto Solusi</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 40px 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        h1 {
            color: white;
            text-align: center;
            margin-bottom: 40px;
            font-size: 2.5em;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .section {
            background: white;
            border-radius: 12px;
            padding: 30px;
            margin-bottom: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        .section h2 {
            color: #333;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 2px solid #667eea;
            font-size: 1.8em;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 20px;
        }

        .card {
            background: #f8f9fa;
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid #e0e0e0;
            transition: transform 0.3s, box-shadow 0.3s;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        .card img {
            width: 100%;
            height: 250px;
            object-fit: cover;
            background: #e0e0e0;
        }

        .card-content {
            padding: 15px;
        }

        .card-title {
            font-weight: 600;
            color: #333;
            font-size: 0.95em;
            word-break: break-word;
        }

        .card-status {
            font-size: 0.85em;
            margin-top: 8px;
            padding: 5px 10px;
            border-radius: 4px;
            display: inline-block;
        }

        .status-ok {
            background: #d4edda;
            color: #155724;
        }

        .status-error {
            background: #f8d7da;
            color: #721c24;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            border-radius: 8px;
            text-align: center;
        }

        .stat-number {
            font-size: 2.5em;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .stat-label {
            font-size: 0.95em;
            opacity: 0.9;
        }

        .loading-indicator {
            display: inline-block;
            width: 12px;
            height: 12px;
            background: currentColor;
            border-radius: 50%;
            animation: pulse 1.5s ease-in-out infinite;
            margin-left: 5px;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        .footer {
            text-align: center;
            color: white;
            margin-top: 40px;
            font-size: 0.9em;
        }

        @media (max-width: 768px) {
            .grid {
                grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
                gap: 15px;
            }

            h1 {
                font-size: 1.8em;
            }

            .section h2 {
                font-size: 1.4em;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎬 Test Asset Gallery</h1>

        <!-- Statistics -->
        <div class="stats">
            <div class="stat-card">
                <div class="stat-number">13</div>
                <div class="stat-label">Films & Series</div>
            </div>
            <div class="stat-card">
                <div class="stat-number">3</div>
                <div class="stat-label">Categories</div>
            </div>
            <div class="stat-card">
                <div class="stat-number">24</div>
                <div class="stat-label">Products</div>
            </div>
        </div>

        <!-- Films Section -->
        <div class="section">
            <h2>🎥 Films & Series</h2>
            <div class="grid" id="filmsGrid">
                <!-- Loaded by JavaScript -->
            </div>
        </div>

        <!-- Elforma Parfum -->
        <div class="section">
            <h2>🌹 Elforma Parfum</h2>
            <div class="grid" id="elformaGrid">
                <!-- Loaded by JavaScript -->
            </div>
        </div>

        <!-- Juragan Medis -->
        <div class="section">
            <h2>⚕️ Juragan Medis</h2>
            <div class="grid" id="juraganGrid">
                <!-- Loaded by JavaScript -->
            </div>
        </div>

        <!-- Magic Bean -->
        <div class="section">
            <h2>✨ Magic Bean</h2>
            <div class="grid" id="magicbeanGrid">
                <!-- Loaded by JavaScript -->
            </div>
        </div>

        <div class="footer">
            <p>✅ Semua aset sudah terintegrasi dan siap diakses</p>
            <p>Kecepatan loading: Ultra cepat dengan lazy loading</p>
        </div>
    </div>

    <script>
        // Fetch dan display data dari API/endpoint
        async function loadAssets() {
            try {
                // Load films
                const filmsResponse = await fetch('/api/films');
                if (filmsResponse.ok) {
                    const films = await filmsResponse.json();
                    displayFilms(films);
                }
            } catch (error) {
                console.log('API belum tersedia - gunakan alternative loading');
                loadStaticAssets();
            }
        }

        function displayFilms(films) {
            const grid = document.getElementById('filmsGrid');
            grid.innerHTML = films.map(film => `
                <div class="card">
                    <img src="${film.poster}" alt="${film.title}" loading="lazy" onerror="this.src='/Asset/FILM/ANAK KOLONG.jpg'">
                    <div class="card-content">
                        <div class="card-title">${film.title}</div>
                        <div class="card-status status-ok">✅ Loaded</div>
                    </div>
                </div>
            `).join('');
        }

        // Fallback dengan data static
        function loadStaticAssets() {
            // Films
            const films = [
                { title: 'ANAK KOLONG', poster: '/Asset/FILM/ANAK KOLONG.jpg' },
                { title: 'KARUNRUNG', poster: '/Asset/FILM/KARUNRUNG.png' },
                { title: 'KORBAN JATUH TEMPO', poster: '/Asset/FILM/KORBAN JATUH TEMPO (PINJOL).jpg' },
                { title: 'TWIST STETHOSCOPE', poster: '/Asset/FILM/TWIST STETHOSCOPE.png' },
                { title: 'Adinda', poster: '/Asset/SERIES/Adinda.png' },
                { title: 'Cinta Suci Romeo', poster: '/Asset/SERIES/Cinta Suci Romeo.jpg' },
                { title: 'Dangerous Dragon', poster: '/Asset/SERIES/Dangerous Dragon.jpg' },
                { title: 'Elegi Cinta Tiara', poster: '/Asset/SERIES/Elegi Cinta Tiara.png' },
                { title: 'I m a Danger', poster: '/Asset/SERIES/I_m a Danger.jpg' },
                { title: 'Karateka Kok Beby Sister', poster: '/Asset/SERIES/Karateka Kok Beby Sister.png' },
                { title: 'One More Chance', poster: '/Asset/SERIES/One More Chance.jpg' },
                { title: 'Sasaeng', poster: '/Asset/SERIES/Sasaeng.png' },
                { title: 'Skuter Asik', poster: '/Asset/SERIES/Skuter Asik.jpg' },
            ];

            const elforma = [
                { title: 'Logo 1', src: '/Asset/Elforma Parfum/Logo Parfum/Salinan IMG-20260303-WA0010.jpg' },
                { title: 'Logo 2', src: '/Asset/Elforma Parfum/Logo Parfum/Salinan IMG-20260303-WA0012.jpg' },
                { title: 'Logo 3', src: '/Asset/Elforma Parfum/Logo Parfum/Salinan IMG-20260303-WA0013.jpg' },
                { title: 'Logo 4', src: '/Asset/Elforma Parfum/Logo Parfum/Salinan IMG-20260303-WA0017.jpg' },
                { title: 'Adore Gold', src: '/Asset/Elforma Parfum/Varian Parfum/Adore Gold.jpg' },
                { title: 'East Blue', src: '/Asset/Elforma Parfum/Varian Parfum/East Blue.jpg' },
                { title: 'Paris Passport', src: '/Asset/Elforma Parfum/Varian Parfum/Paris Passport.jpg' },
                { title: 'Sorbe Rose', src: '/Asset/Elforma Parfum/Varian Parfum/Sorbe Rose.jpg' },
                { title: 'The VIP', src: '/Asset/Elforma Parfum/Varian Parfum/The VIP.jpg' },
                { title: 'Vanilla Rose', src: '/Asset/Elforma Parfum/Varian Parfum/_Vanilla Rose.jpg' },
            ];

            const juragan = [
                { title: 'HIV & Sifilis', src: '/Asset/Juragan Medis/Asset Produk/Salinan HIV & Sifilis.jpg' },
                { title: 'Tes HIV/AIDS', src: '/Asset/Juragan Medis/Asset Produk/Salinan Tes HIV_Aids.jpg' },
                { title: 'Tes Sifilis', src: '/Asset/Juragan Medis/Asset Produk/Salinan Tes Sifilis.jpg' },
            ];

            const magicbean = [
                { title: 'Katalog 1', src: '/Asset/Magic Bean/Katalog/1.png' },
                { title: 'Katalog 2', src: '/Asset/Magic Bean/Katalog/2.png' },
                { title: 'Katalog 3', src: '/Asset/Magic Bean/Katalog/3.png' },
                { title: 'Katalog 4', src: '/Asset/Magic Bean/Katalog/4.png' },
                { title: 'Katalog 5', src: '/Asset/Magic Bean/Katalog/5.png' },
                { title: 'Katalog 6', src: '/Asset/Magic Bean/Katalog/6.png' },
                { title: 'Katalog 7', src: '/Asset/Magic Bean/Katalog/7.png' },
                { title: 'Katalog 8', src: '/Asset/Magic Bean/Katalog/8.png' },
                { title: 'Katalog 9', src: '/Asset/Magic Bean/Katalog/9.png' },
                { title: 'Katalog 10', src: '/Asset/Magic Bean/Katalog/10.png' },
                { title: 'Logo 1', src: '/Asset/Magic Bean/Logo/1.png' },
                { title: 'Logo 2', src: '/Asset/Magic Bean/Logo/2.png' },
                { title: 'Logo 3', src: '/Asset/Magic Bean/Logo/3.png' },
                { title: 'Logo 4', src: '/Asset/Magic Bean/Logo/4.png' },
                { title: 'Logo 5', src: '/Asset/Magic Bean/Logo/5.png' },
            ];

            document.getElementById('filmsGrid').innerHTML = films.map(film => `
                <div class="card">
                    <img src="${film.poster}" alt="${film.title}" loading="lazy">
                    <div class="card-content">
                        <div class="card-title">${film.title}</div>
                        <div class="card-status status-ok">✅ Loaded</div>
                    </div>
                </div>
            `).join('');

            document.getElementById('elformaGrid').innerHTML = elforma.map(item => `
                <div class="card">
                    <img src="${item.src}" alt="${item.title}" loading="lazy">
                    <div class="card-content">
                        <div class="card-title">${item.title}</div>
                        <div class="card-status status-ok">✅ Loaded</div>
                    </div>
                </div>
            `).join('');

            document.getElementById('juraganGrid').innerHTML = juragan.map(item => `
                <div class="card">
                    <img src="${item.src}" alt="${item.title}" loading="lazy">
                    <div class="card-content">
                        <div class="card-title">${item.title}</div>
                        <div class="card-status status-ok">✅ Loaded</div>
                    </div>
                </div>
            `).join('');

            document.getElementById('magicbeanGrid').innerHTML = magicbean.map(item => `
                <div class="card">
                    <img src="${item.src}" alt="${item.title}" loading="lazy">
                    <div class="card-content">
                        <div class="card-title">${item.title}</div>
                        <div class="card-status status-ok">✅ Loaded</div>
                    </div>
                </div>
            `).join('');
        }

        // Load on page ready
        document.addEventListener('DOMContentLoaded', loadAssets);

        // Or load static immediately
        setTimeout(loadAssets, 500);
    </script>
</body>
</html>
